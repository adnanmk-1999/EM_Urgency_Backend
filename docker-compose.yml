services:
  mysql:
    image: mysql:5.7
    container_name: emurgency-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: em_urgency
      MYSQL_USER: emuser
      MYSQL_PASSWORD: empass
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: emurgency-backend
    restart: always
    depends_on:
      - mysql
    env_file:
      - .env.mysql
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - .:/app
      - /app/node_modules
    command: >
      sh -c "
        sleep 5 &&
        npm run seed &&
        npm start
      "

volumes:
  mysql_data:
